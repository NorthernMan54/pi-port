#
# One emulated AI Port on a private Docker bridge network. Made for a Protect
# console running on the same host (e.g. dciancu/unifi-protect-unvr-docker-arm64
# with network_mode: host): the bridge gives the emulator its own :443 next to
# the console's, and host <-> container traffic is routed without NAT, so the
# console reaches it at AIPORT_IP. A console on another machine can't reach
# that IP -- use scripts/install.sh (macvlan) there. See docker/README.md.
#
#   cd docker
#   AIPORT_CONSOLE=<console-ip> docker compose up -d --build
#
# Coral: /dev/bus/usb is bind-mounted (not passed as one --device) because the
# USB Coral re-enumerates with a new device number once libedgetpu loads its
# firmware; the cgroup rule allows the USB character devices (major 189).
name: piport

services:
  aiport:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ACCEL: ${AIPORT_ACCEL:-edgetpu}
    image: piport:${AIPORT_ACCEL:-edgetpu}
    container_name: piport-aiport
    restart: unless-stopped
    init: true  # forwards docker stop's SIGTERM to run_all.py and its children
    environment:
      AIPORT_CONSOLE: ${AIPORT_CONSOLE:?set AIPORT_CONSOLE to the Protect console IP}
      AIPORT_HOSTNAME: ${AIPORT_HOSTNAME:-piport}
      AIPORT_DEBUG: ${AIPORT_DEBUG:-false}
    volumes:
      - aiport-data:/data
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
    shm_size: 256m  # per-camera snapshot JPEGs live in /dev/shm
    networks:
      aiport:
        ipv4_address: ${AIPORT_IP:-172.30.10.10}

networks:
  aiport:
    driver: bridge
    ipam:
      config:
        - subnet: ${AIPORT_SUBNET:-172.30.10.0/24}

volumes:
  aiport-data:
