# AI Port emulator configuration (see config.py for defaults/merge rules).
# CLI flags on each script still override any value here.

[identity]
# MAC (12 hex chars, no colons). Leave empty to derive a Ubiquiti-OUI MAC from
# the interface's real MAC (FC:EC:DA:<last-3-octets>).
mac =
# Hostname advertised over discovery/hello/API.
hostname = piport
# Catalog model string the discovery matcher expects for sysid 0xa5f1.
platform = UVC AI Port
# System ID mapping to the platform string (0xa5f1 = "UVC AI Port").
sysid = 0xa5f1
# Firmware version reported over ucp4/avclient/http.
fw_version = 5.1.12.67
# Longer firmware string the L2 discovery protocol uses.
discovery_fw_version = aiport4G.mt8390.v5.1.12.67.emu.260904.0000
# Per-device identity (must be unique per emulated instance).
device_id = fe6488e7-7042-5bcb-ab86-6f0ad1a5baed
# Product-catalog GUID for the AI Port SKU.
guid = 5c2659d4-48f3-16c4-ed83-2fefbad37066

[network]
# Interface this instance is bound to; blank = auto-detect (the default-route NIC,
# so a bare `run_all.py`/`discovery.py` works when it isn't eth0). Set to pin one.
iface =
# Physical interface new macvlan instances are built on. Blank = use [network]
# iface, else auto-detect. Set it to pin the parent (e.g. enP4p65s0).
parent_iface =
# How the device gets its IP: "dhcp" (read the interface's live lease/OS
# address) or "static" (use ip/netmask/gateway below).
mode = dhcp
ip =
netmask = 255.255.255.0
gateway =
dns =

[console]
# The UniFi Protect controller (UNVR) the avclient dials when not yet adopted.
host =
port = 7442

[logging]
debug = false
