#
# Single-instance AI Port emulator, host networking (x86_64/arm64) -- the Komodo
# Stack file. Set AIPORT_CONSOLE_HOST etc. via env; one instance per host.

name: piport

services:
  aiport:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ACCEL: cpu
    image: piport-cpu
    container_name: piport-cpu
    # L2 discovery (:10001) and :443 must be on the real LAN; the default bridge NATs both away.
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    environment:
      AIPORT_CONSOLE_HOST: "${AIPORT_CONSOLE_HOST:-}"
      AIPORT_CONSOLE_PORT: "${AIPORT_CONSOLE_PORT:-7442}"
      AIPORT_MAC: "${AIPORT_MAC:-}"
      AIPORT_DEVICE_ID: "${AIPORT_DEVICE_ID:-}"
      AIPORT_HOSTNAME: "${AIPORT_HOSTNAME:-piport}"
      AIPORT_NAME: "${AIPORT_NAME:-AI Port}"
      AIPORT_IFACE: "${AIPORT_IFACE:-}"
      AIPORT_DEBUG: "${AIPORT_DEBUG:-}"
    # volumes:
    #   - ./piport/aiport.cfg:/app/piport/aiport.cfg:ro   # full identity/network surface

  # Optional status page on :8090 (CPU/mem; no auth; GPU/NPU panels are RK3588-only).
  webui:
    image: piport-cpu
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ACCEL: cpu
    container_name: piport-webui
    network_mode: host
    restart: unless-stopped
    entrypoint: ["python3", "piport/sysinfo_server.py"]
    command: ["--bind-ip", "0.0.0.0", "--port", "8090"]
