# Single-instance AI Port emulator, host networking; the Komodo Stack file.

name: diyport

services:
  aiport:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ACCEL: cpu
    image: diyport-cpu
    container_name: diyport-cpu
    # L2 discovery (:10001) and :443 must be on the real LAN; the default bridge NATs both away.
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    environment:
      AIPORT_CONSOLE_HOST: "${AIPORT_CONSOLE_HOST:-}"
      AIPORT_CONSOLE_PORT: "${AIPORT_CONSOLE_PORT:-7442}"
      AIPORT_MAC: "${AIPORT_MAC:-}"
      AIPORT_DEVICE_ID: "${AIPORT_DEVICE_ID:-}"
      AIPORT_HOSTNAME: "${AIPORT_HOSTNAME:-diyport}"
      AIPORT_NAME: "${AIPORT_NAME:-AI Port}"
      AIPORT_IFACE: "${AIPORT_IFACE:-}"
      AIPORT_DEBUG: "${AIPORT_DEBUG:-}"
    # Persist adoption state/certs across `up -d --build`.
    command: ["--state-dir", "/data"]
    shm_size: 256m   # per-camera snapshot JPEGs live in /dev/shm
    volumes:
      - diyport-data:/data
    # volumes:
    #   - ./diyport/aiport.cfg:/app/diyport/aiport.cfg:ro   # full identity/network surface

  # Optional status page on :8090 (CPU/mem; no auth; GPU/NPU panels are RK3588-only).
  webui:
    image: diyport-cpu
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ACCEL: cpu
    container_name: diyport-webui
    network_mode: host
    restart: unless-stopped
    entrypoint: ["python3", "diyport/sysinfo_server.py"]
    command: ["--bind-ip", "0.0.0.0", "--port", "8090"]

volumes:
  diyport-data:
