#
# Pi Port -- multi-instance / dedicated-IP AI Port emulator on a macvlan network.
# A macvlan attachment gives each container its own MAC + LAN IP, so the console
# sees independent AI Ports (matching what instance_manager.py does on the RK3588
# board). Docker's default bridge NATs discovery away and cannot present a genuine
# LAN identity, so it is not an option here.
#
# ILLUSTRATIVE -- replace every <placeholder> before use, then:
#   docker compose -f docker/compose.macvlan.yaml up -d --build
#
# Caveats:
#  * The host cannot reach macvlan container IPs without an extra macvlan shim
#    interface on the host (the console on the LAN can).
#  * Every instance needs a UNIQUE MAC, device-id AND IP; two sharing a MAC or
#    device-id look like one AI Port to the console.

name: piport

services:
  aiport-main:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: piport-cpu
    container_name: piport-main
    command:
      - "--mac=FCECDA000001"                                # <placeholder>, unique
      - "--device-id=00000000-0000-4000-8000-000000000001"  # <placeholder>, unique
      - "--hostname=piport-main"
    environment:
      AIPORT_CONSOLE_HOST: "${AIPORT_CONSOLE_HOST:-}"
    networks:
      lan:
        ipv4_address: 192.0.2.230  # <placeholder> -- a real free LAN address
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: eth0   # <-- replace with the real host NIC connected to the LAN
    ipam:
      config:
        - subnet: 192.0.2.0/24    # <-- replace
          gateway: 192.0.2.1      # <-- replace
