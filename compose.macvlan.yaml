#
# Dedicated LAN IP per container (macvlan). Use instead of compose.yaml when the
# container must be a distinct L2 device (own IP/MAC, own :443, several instances).
# Static IPs only (no Docker DHCP); wired parent NIC; the host can't reach the
# container IP without a shim. Every instance needs a unique IP, MAC and device-id.
# ILLUSTRATIVE -- replace the <placeholders>.

name: piport

services:
  aiport:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: piport-cpu
    container_name: piport-macvlan
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    environment:
      AIPORT_CONSOLE_HOST: "${AIPORT_CONSOLE_HOST:-}"
      AIPORT_CONSOLE_PORT: "${AIPORT_CONSOLE_PORT:-7442}"
      AIPORT_HOSTNAME: "${AIPORT_HOSTNAME:-piport}"
      AIPORT_NAME: "${AIPORT_NAME:-AI Port}"
      AIPORT_IFACE: "${AIPORT_IFACE:-eth0}"
      AIPORT_MAC: "FCECDA000001"   # must match mac_address below (protocol identity)
    networks:
      lan:
        ipv4_address: 192.0.2.230   # <placeholder> -- a real free LAN address
        mac_address: "FC:EC:DA:00:00:01"

  # Second instance: copy the block above and change container_name, AIPORT_MAC,
  # mac_address and ipv4_address (all unique).

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: eth0   # <-- replace with the real host NIC connected to the LAN
    ipam:
      config:
        - subnet: 192.0.2.0/24    # <-- replace
          gateway: 192.0.2.1      # <-- replace
